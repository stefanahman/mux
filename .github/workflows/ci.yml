name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: make lint
      - run: make test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: brew install tmux
      - run: make test

  # Static analysis on the current Go; the jobs above prove the minimum
  # in go.mod still builds and passes.
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # staticcheck 2026.2.1 cannot read go1.27.2's export data ("export
      # data version 5 is greater than maximum supported version 4"), so
      # it runs on the last Go it can. Back to stable with
      # the staticcheck release that reads it.
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      # govulncheck on stable: mux ships no binary, and the standard
      # library a consumer gets is its own toolchain's.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
